---
name: Docs tests

on:
  push:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs-tests.yml"
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs-tests.yml"

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  mkdocs-build:
    name: mkdocs build --strict
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install MkDocs Material
        run: uv tool install "mkdocs==1.6.1" --with "mkdocs-material==9.7.6" --with "mkdocs-git-revision-date-localized-plugin"

      - name: Build site (strict)
        run: mkdocs build --clean --strict
