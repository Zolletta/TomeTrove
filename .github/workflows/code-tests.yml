name: Code tests

on:
  push:
    paths:
      - "src/**"
      - "test/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "biome.json"
      - "vitest.config.ts"
      - "wrangler.jsonc"
      - "worker-configuration.d.ts"
      - ".github/workflows/code-tests.yml"
  pull_request:
    paths:
      - "src/**"
      - "test/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "biome.json"
      - "vitest.config.ts"
      - "wrangler.jsonc"
      - "worker-configuration.d.ts"
      - ".github/workflows/code-tests.yml"

permissions:
  contents: read

jobs:
  check:
    name: typecheck, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
