site_name: TomeTrove
site_url: https://docs.tometrove.zolletta.org/
site_description: The definitive book list
repo_url: https://github.com/Zolletta/TomeTrove
repo_name: Zolletta/TomeTrove
edit_uri: edit/main/docs/

docs_dir: .
site_dir: ../mkdocs_build

theme:
  name: material
  language: en
  custom_dir: overrides
  font:
    text: Outfit
    code: Outfit
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - content.action.edit
    - content.code.copy
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: tometrove/moon
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: tometrove/sun
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

extra_css:
  - assets/css/extra.css

plugins:
  - search
  - git-revision-date-localized:
      type: date
      enable_creation_date: false
      fallback_to_build_date: true
      exclude:
          - index.md

nav:
  - "Home": index.md
  - "Tutorials":
      - tutorials/index.md
  - "How-to guides":
      - how-to/index.md
  - "Reference":
