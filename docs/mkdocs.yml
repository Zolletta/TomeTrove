      - "Data model": reference/data-model.md
      - "API endpoints": reference/api-endpoints.md
      - "Scheduled flows": reference/scheduled-flows.md
      - "Author normalization": reference/author-normalization.md
      - "Icons": reference/icons.md
      - "Ontology":
          - reference/ontology/index.md
          - "Fiction": reference/ontology/fiction.md
          - "Poetry": reference/ontology/poetry.md
          - "Theatre": reference/ontology/theatre.md
          - "Comics": reference/ontology/comics.md
          - "Essay": reference/ontology/essay.md
